openadservice:
  name: point-cloud-fusion
  image: ghcr.io/openads-project/point_cloud_fusion:v1.4.0
  env:
    # --- name ------
    NAMESPACE: /
    NAME: point_cloud_fusion
    # --- outputs ---
    POINT_CLOUD_TOPIC: ~/point_cloud
    # --- other -----
    LOG_LEVEL: info
    USE_SIM_TIME: false
    PARAMS: /docker-ros/ws/install/point_cloud_fusion/share/point_cloud_fusion/config/params.yml
    TRACE: false
  args:
  - /bin/bash
  - -ic
  - |
    ros2 launch point_cloud_fusion point_cloud_fusion.launch.py \
      namespace:=${NAMESPACE} \
      name:=${NAME} \
      log_level:=${LOG_LEVEL} \
      use_sim_time:=${USE_SIM_TIME} \
      params:=${PARAMS} \
      trace:=${TRACE} \
      point_cloud_topic:=${POINT_CLOUD_TOPIC}
  rosParamFileMountPath: /docker-ros/ws/install/point_cloud_fusion/share/point_cloud_fusion/config/params.yml
  rosParamFileData: null
